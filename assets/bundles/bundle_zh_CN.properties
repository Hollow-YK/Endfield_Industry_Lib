# 单位
unit.endfield-industry-lib-ram.name=大角天使
unit.endfield-industry-lib-ram.description=“克利俄松”（归档编号：ACL071），能用角冲撞敌人。它们是最早被记录的天使形成模式之一，于各处都较常见。
unit.endfield-industry-lib-heavy-ram.name=刚角天使
unit.endfield-industry-lib-heavy-ram.description=“提利索隆”（归档编号：ACL072），ACL071的非模式种。它们能够利用周围环境，表现出一定的决策能力。

# 单位 — Landbreakers 人形族
unit.ambusher.name=伏击者
unit.ambusher.description=Landbreakers 人形族的 T1 远程单位，以弩箭在远距离持续输出。换弹时会寻找掩体躲避，被近身后会迅速逃离。

unit.raider.name=突袭者
unit.raider.description=Landbreakers 人形族的 T1 近战单位，手持砍刀横扫前方扇形区域。比伏击者更耐打、移动更快，贴身挥砍近身之敌。

unit.infiltrator.name=潜行者
unit.infiltrator.description=Landbreakers 人形族的 T1 高速刺客。潜行时几乎无法被索敌、子弹会穿透它且伤害无效，被射击时左右横跳闪避；发起攻击后转为正常战斗，首次降至半血时向后猛跳 8 格并释放烟雾弹烟雾，重新遁入潜行。始终与友军保持 5 格距离。

unit.vanguard.name=先锋
unit.vanguard.description=Landbreakers 人形族的 T1 盾戳单位。举一面盾牌（独立单位，325 血 / 15 甲）吸收正面伤害，持盾期间本体获得 50% 减伤；右手长矛戳刺近身之敌，还能作为同族伏击者的移动掩体。盾牌被击碎，或受到计划新建的“物理效果”异常影响时，将失去盾牌。