#星球
# 塔罗斯 (Talos)
planet.endfield-industry-lib-talos.name = 塔罗斯
planet.endfield-industry-lib-talos.description = 一颗巨大的气态行星，散发着幽蓝的光芒。
planet.endfield-industry-lib-talos.details = 它的引力统治着整个星系，是塔卫二的母星。

# 塔卫二 (Taelos II)
techtree.taelos-II = 塔卫二
planet.endfield-industry-lib-taelos-II.name = 塔卫二
planet.endfield-industry-lib-taelos-II.description = “塔罗斯”的天然卫星之一。
planet.endfield-industry-lib-taelos-II.details = 塔卫二是气态巨行星“塔罗斯”的天然卫星之一。\n\n一百五十二年前，来自泰拉的拓荒者重启星门，初次踏足这颗卫星。在它富含氮气、氧气与温室气体的大气天穹之外，唯有陌生而遥远的恒星与高悬于顶的气态巨行星对人们作出提醒：远方来客，你们已离家不知几数光年。\n\n幸运的是，塔卫二巍峨的群山、交错的水体以及繁盛的植被群落孕育了一个颇为完整的生态圈。在星门崩溃，与家园之间的联系被断绝的一个多世纪以来，这里的环境资源成为了人们自谋出路的关键。经过几代人的开拓，失落于新世界的拓荒者最终设法站稳了脚跟，建立了崭新的文明家园。\n\n据观测，在塔卫二的公转轨道内外，分布着数量未知的小型卫星——塔卫二是其中唯一的宜居星球。由于塔卫二在行星系统中所处的独特位置以及星门这样的“遗产”存在，我们认为，这颗卫星的宜居环境并非宇宙的意外馈赠。
# 战役扇区
sector.endfield-industry-lib-theHub.name=枢纽区
sector.endfield-industry-lib-theHub.description=塔卫二开拓计划的起点。在这里建立前哨站，抵御敌人的进攻。

sector.endfield-industry-lib-theHub-ii.name=枢纽区-II
sector.endfield-industry-lib-theHub-ii.description=进一步巩固前哨站的防御，收集足够的资源以支持后续行动。

sector.endfield-industry-lib-originiumSciencePark.name=源石科技园
sector.endfield-industry-lib-originiumSciencePark.description=保护护送单位安全穿越源石科技园，抵达核心区域。

sector.endfield-industry-lib-originiumSciencePark-ii.name=源石科技园-II
sector.endfield-industry-lib-originiumSciencePark-ii.description=在源石科技园深处收集足够的源石外壳。

sector.endfield-industry-lib-originLodespring.name=矿脉源区
sector.endfield-industry-lib-originLodespring.description=护送单位穿越危机四伏的矿脉源区，无核心作战。

sector.endfield-industry-lib-originLodespring-ii.name=矿脉源区-II
sector.endfield-industry-lib-originLodespring-ii.description=摧毁三处侵蚀核，击败最终首领。

sector.endfield-industry-lib-powerPlateau.name=供能高地
sector.endfield-industry-lib-powerPlateau.description=限时护送单位到达目标位置，挖掘侵蚀核可增加倒计时。

sector.endfield-industry-lib-powerPlateau-ii.name=供能高地-II
sector.endfield-industry-lib-powerPlateau-ii.description=摧毁四角炮台，迎接最终决战。

