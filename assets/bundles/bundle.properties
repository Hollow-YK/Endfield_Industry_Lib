# 塔罗斯 (Talos)
planet.endfield-industry-lib-talos.name = Talos
planet.endfield-industry-lib-talos.description = 一颗巨大的气态行星，散发着幽蓝的光芒。
planet.endfield-industry-lib-talos.details = 它的引力统治着整个星系，是塔卫二的母星。

# 塔卫二 (Taelos II)
techtree.taelos-II = Taelos II
planet.endfield-industry-lib-taelos-II.name = Taelos II
planet.endfield-industry-lib-taelos-II.description = 环绕塔罗斯运行的岩石卫星。
planet.endfield-industry-lib-taelos-II.details = 地表炎热干燥，蕴藏着丰富的矿产资源。

# 单位 — Landbreakers 人形族
unit.ambusher.name=Ambusher
unit.ambusher.description=A T1 ranged unit of the Landbreakers humanoid race, dealing sustained damage with crossbow bolts from afar. It seeks cover while reloading, and flees quickly when enemies get close.

unit.raider.name=Raider
unit.raider.description=A T1 melee unit of the Landbreakers humanoid race, wielding a machete to sweep a wide arc in front. Tougher and faster than the Ambusher, it closes in to hack down enemies at close range.

unit.infiltrator.name=Infiltrator
unit.infiltrator.description=A T1 high-speed assassin of the Landbreakers humanoid race. While stealthed it is nearly impossible to target and bullets pass right through it, but it dodges sideways when fired upon; once it strikes it fights normally, until dropping to half HP triggers a smoke-bomb leap backwards back into stealth. It always keeps 5 tiles away from allied units.

unit.vanguard.name=Vanguard
unit.vanguard.description=A T1 shield-and-spear unit of the Landbreakers humanoid race. It raises a shield (a separate unit with 325 HP and 15 armor) that absorbs frontal damage and grants 50% damage reduction while held; stabs enemies with a spear in its right hand, and can serve as mobile cover for allied Ambushers. If the shield is broken or it is hit by a physical-effect anomaly (planned), the shield is lost.

# 单位
unit.endfield-industry-lib-ram.name=Ram
unit.endfield-industry-lib-ram.description=“克利俄松”（归档编号：ACL071），能用角冲撞敌人。它们是最早被记录的天使形成模式之一，于各处都较常见。
unit.endfield-industry-lib-heavy-ram.name=Heavy Ram
unit.endfield-industry-lib-heavy-ram.description=“提利索隆”（归档编号：ACL072），ACL071的非模式种。它们能够利用周围环境，表现出一定的决策能力。